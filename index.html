<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Editor · QR Quest</title>
  <link rel="stylesheet" href="https://gagls-qr-quest.github.io/shared/v1/style.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="qrq-header">
    <span class="qrq-logo">QR</span>
    <h1 id="nazov">Editor questov</h1>
  </header>

  <main class="qrq-main qrq-main--wide">
    <section id="obsah" class="qrq-card" aria-live="polite">
      <h2>Základné údaje questu</h2>
      <form id="quest-form">
        <label class="qrq-label" for="quest-id">ID questu</label>
        <input type="text" id="quest-id" class="qrq-input" placeholder="napr. skola-2026" required>

        <label class="qrq-label" for="quest-title">Názov</label>
        <input type="text" id="quest-title" class="qrq-input" placeholder="napr. Tajomstvo školy" required>

        <label class="qrq-label" for="quest-intro">Úvod</label>
        <textarea id="quest-intro" class="qrq-input" rows="3" placeholder="Krátky úvod pre hráčov..." required></textarea>

        <label class="qrq-label" for="quest-mode">Režim</label>
        <select id="quest-mode" class="qrq-input">
          <option value="free">free</option>
          <option value="linear">linear</option>
        </select>

        <button type="submit" class="qrq-btn">Stiahnuť quest.json</button>
      </form>
    </section>
  </main>

  <footer class="qrq-footer">
    Modul <strong>Editor</strong> · Alex <a href="https://github.com/gagls-qr-quest/editor">zdrojový kód</a>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
